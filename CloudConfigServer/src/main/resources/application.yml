spring:
  application:
    name: Cloud-CONFIG-SERVER
  cloud:
    config:
      server:
        git:
          uri: https://github.com/chandanap624-afk/cloud-config-server.git
          default-label: main
          clone-on-start: true

server:
  port: 9196

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info